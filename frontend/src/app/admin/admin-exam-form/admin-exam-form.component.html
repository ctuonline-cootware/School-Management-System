<div class="exam-form-container">
  <h2>Add New Assignment</h2>

  <form [formGroup]="assignmentForm" (ngSubmit)="submitForm()" novalidate>
    <div *ngIf="successMessage" class="alert alert-success" role="status">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-error" role="alert">{{ errorMessage }}</div>

    <div class="form-group">
      <label for="name">Assignment Name:</label>
      <input id="name" type="text" formControlName="name" placeholder="Enter assignment name" />
      <div class="field-error" *ngIf="assignmentForm.get('name')?.touched && assignmentForm.get('name')?.hasError('required')">Exam name is required.</div>
    </div>

    <div class="form-group">
      <label for="start_date">Start Date:</label>
      <input id="start_date" type="date" formControlName="start_date" />
      <div class="field-error" *ngIf="assignmentForm.get('start_date')?.touched && assignmentForm.get('start_date')?.hasError('required')">Start date is required.</div>
    </div>

    <div class="form-group">
      <label for="max_points">Max Points:</label>
      <input id="max_points" type="number" formControlName="max_points" placeholder="Enter maximum points" min="0" />
      <div class="field-error" *ngIf="assignmentForm.get('max_points')?.touched && assignmentForm.get('max_points')?.hasError('required')">Max points is required.</div>
    </div>

    <div class="form-group checkbox">
      <label for="is_active">
        <input id="is_active" type="checkbox" formControlName="is_active" />
        Active
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="assignmentForm.invalid">Add Exam</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
    </div>
  </form>
</div>
