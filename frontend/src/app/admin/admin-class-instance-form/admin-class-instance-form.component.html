<div class="class-instance-form-container">
  <h2>Add New Class Instance</h2>


  <!--

            /** Term */
            term: string;
            /**
             * Start Date
             * Format: date-time
             */
            start_date: string;
            /** Location */
            location: string;
            /** End Date */
            end_date: string | null;
            /** Instance Id */
            instance_id: number;
            /**
             * Students
             * @default []
             */
            students: components["schemas"]["Student"][];

  -->

  <form [formGroup]="courseInstanceForm" (ngSubmit)="submitForm()" novalidate>
    <div *ngIf="successMessage" class="alert alert-success" role="status">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-error" role="alert">{{ errorMessage }}</div>

    <div class="form-group">
      <label for="course_id">Course</label>
      <select id="course_id" formControlName="courseId">
        <option value="">Select a course</option>
        <option *ngFor="let course of (courses$ | async)" [value]="course.course_id">
          {{ course.name }} ({{ course.code }})
        </option>
      </select>
      <span class="error" *ngIf="courseInstanceForm.get('courseId')?.hasError('required') && courseInstanceForm.get('courseId')?.touched">
        Course is required
      </span>
    </div>

    <div class="form-group">
      <label for="faculty_id">Faculty</label>
      <select id="faculty_id" formControlName="facultyId">
        <option value="">Select faculty</option>
        <option *ngFor="let faculty of (faculty$ | async)" [value]="faculty.faculty_id">
          {{ faculty.first_name }} {{ faculty.last_name }}
        </option>
      </select>
      <span class="error" *ngIf="courseInstanceForm.get('facultyId')?.hasError('required') && courseInstanceForm.get('facultyId')?.touched">
        Faculty is required
      </span>
    </div>

    <div class="form-group">
      <label for="section_number">Term</label>
      <input id="section_number" type="text" formControlName="term" placeholder="e.g., A, B, 01">
      <span class="error" *ngIf="courseInstanceForm.get('term')?.hasError('required') && courseInstanceForm.get('term')?.touched">
        Term is required
      </span>
    </div>

    <div class="form-group">
      <label for="start_date">Start Date</label>
      <input id="start_date" type="date" formControlName="startDate">
      <span class="error" *ngIf="courseInstanceForm.get('startDate')?.hasError('required') && courseInstanceForm.get('startDate')?.touched">
        Start date is required
      </span>
    </div>

    <div class="form-group">
      <label for="end_date">Location</label>
      <input id="end_date" type="text" formControlName="location">
      <span class="error" *ngIf="courseInstanceForm.get('location')?.hasError('location') && courseInstanceForm.get('location')?.touched">
        location is required
      </span>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="courseInstanceForm.invalid">
        Create Instance
      </button>
      <button type="reset" class="btn btn-secondary" (click)="resetForm()">
        Reset
      </button>
    </div>
  </form>
</div>
